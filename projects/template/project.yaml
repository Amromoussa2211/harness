project:
  name: PROJECT_NAME  # e.g. "my-app"
  description: PROJECT_DESCRIPTION  # e.g. "Customer-facing web application"

application:
  web: true
  api: true
  mobile: false

automation:
  framework: playwright  # or cypress, pytest, etc.
  language: javascript   # or python, java, etc.

target_repository:
  path: ../target-project  # relative path to your test automation repo
  ci_workspace: false

api:
  rest: true
  graphql: false
  webhooks: false

database:
  enabled: false
  type: none

performance:
  enabled: false

security:
  enabled: false

accessibility: false
visual: false
events: false
webhooks: false

ci:
  provider: none

environments:
  dev: false
  staging: false
  production: false

safety:
  production_execution: false
  real_payments: false
  destructive_database_operations: false

test_data:
  fixtures: false
  generated: false

secrets:
  credentials: false
  api_keys: false
  certificates: false
