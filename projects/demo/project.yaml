project:
  name: demo
  description: Demo project for QA Harness workflow validation

application:
  web: true
  mobile: false
  api: true

automation:
  framework: playwright
  language: javascript

api:
  rest: true
  graphql: false
  webhooks: false

database:
  enabled: false
  type: none

target_repository:
  # Path to the target project repository (relative to harness root or absolute).
  # Leave empty or omit if the target is the same as the Harness project directory.
  # Example: ../my-app-repo
  path: ../demo-target-project
  # When true, the adapter treats this as a CI workspace checkout.
  # CI workflows may inject paths at runtime instead of static config.
  ci_workspace: false

ci:
  provider: none

environments:
  dev: false
  staging: false
  production: false

safety:
  production_execution: false
  real_payments: false
  destructive_database_operations: false
